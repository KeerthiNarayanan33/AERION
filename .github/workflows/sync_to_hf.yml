name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }} # e.g. username/aerion-surveillance
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          git push --force https://USER:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE main
