version: '3.8'

services:
  sentinel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-border-surveillance
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SYSTEM_MODE=SIMULATION
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - CAMERA_DEFAULT_INDEX=0
      - AI_DEVICE=cpu
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
