# ==============================================================================
# AERION | SENTINEL-AI — Render Deployment Manifest
# ==============================================================================
# Render detects this file and provisions all resources on git push.
# IMPORTANT: SECRET_KEY is auto-generated by Render (generateValue: true).
# ==============================================================================

services:
  - type: web
    name: aerion-sentinel-ai
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Render injects $PORT; the CMD reads ${PORT:-10000}
    healthCheckPath: /api/system/health

    autoDeploy: true
    branch: main

    # MINIMUM Starter plan ($7/mo) required — free tier (512 MB) will OOM crash.
    plan: starter

    # Persistent disk for SQLite DB, snapshots, and evidence recordings
    disk:
      name: aerion-storage
      mountPath: /app/storage
      sizeGB: 5

    envVars:
      - key: SYSTEM_MODE
        value: SIMULATED
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      # PORT is injected automatically by Render — do not override here
      - key: DATABASE_URL
        value: sqlite:////app/storage/surveillance.db
      - key: STORAGE_DIR
        value: /app/storage
      - key: AI_INFERENCE_FPS
        value: "10"
      - key: DETECTION_CONFIDENCE
        value: "0.50"
      - key: YOLO_MODEL_NAME
        value: yolov8n.pt
      - key: TRACKING_ENABLED
        value: "True"
      - key: DRONE_MODE
        value: SIMULATION
      - key: GPS_MODE
        value: SIMULATION
      - key: PIR_MODE
        value: SIMULATION
      - key: RADAR_ENABLED
        value: "False"
      - key: SECURITY_AUTH_ENABLED
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: RETENTION_DAYS
        value: "7"
      - key: PRE_EVENT_SECONDS
        value: "10"
      - key: POST_EVENT_SECONDS
        value: "15"
      - key: EVENT_COOLDOWN_SECONDS
        value: "10"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
